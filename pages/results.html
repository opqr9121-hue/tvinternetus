<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Providers in Your Area | TV Internet US</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">TV Internet US</a>

    <nav class="main-nav">
      <a href="../index.html">Home</a>
      <a href="results.html">Internet Providers</a>
      <a href="guide.html">Guide</a>
      <a href="provider.html">Providers</a>
    </nav>
  </div>
</header>

<main>

<section class="page-hero">
  <div class="container">
    <a href="../index.html" class="back-link">← Back to Home</a>

    <h1>Providers in your area</h1>

    <p>
      Based on coverage data for your ZIP code.
      Confirm exact plans with each provider.
    </p>

    <p id="zipDisplay"></p>
  </div>
</section>

<section class="results-section">
  <div class="container">
    <div id="providerResults"></div>
  </div>
</section>

</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2026 TV Internet US. All rights reserved.</p>
  </div>
</footer>

<script src="../js/providers.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const zip = params.get("zip");

const zipDisplay = document.getElementById("zipDisplay");
const providerResults = document.getElementById("providerResults");

if (zip) {
  zipDisplay.textContent =
    "Showing available providers for ZIP code " + zip;
} else {
  zipDisplay.textContent =
    "No ZIP code was entered.";
}

let availableProviders = [];

if (zip && typeof getProvidersForZip === "function") {
  availableProviders = getProvidersForZip(zip);
}

if (!availableProviders.length) {

  providerResults.innerHTML = `
    <div class="provider-card">
      <h2>No Providers Found</h2>
      <p>
        No providers were found for this ZIP code.
      </p>
      <a href="../index.html" class="btn">
        Check Another ZIP Code
      </a>
    </div>
  `;

} else {

  providerResults.innerHTML = `

    <div class="results-grid">

      ${availableProviders.map(provider => `

        <article class="provider-card">

          <div class="provider-logo">
            ${
              provider.logo
              ? `<img src="../${provider.logo}" alt="${provider.name} logo" style="max-width:180px;">`
              : ""
            }
          </div>

          <h2>${provider.name}</h2>

          <p>
            ${provider.description || ""}
          </p>

          <p>
            <strong>Technology:</strong>
            ${provider.tech || "N/A"}
          </p>

          <p>
            <strong>Maximum Speed:</strong>
            ${provider.maxSpeed || "N/A"}
          </p>

          <p>
            <strong>Starting Price:</strong>
            ${provider.priceFrom || "N/A"}
          </p>

          <a
            href="provider.html?id=${encodeURIComponent(provider.id)}"
            class="btn"
          >
            View Provider
          </a>

        </article>

      `).join("")}

    </div>

  `;

}

</script>

</body>
</html>
